version: '3.8'

networks:
  buzz-network:
    driver: bridge

volumes:
  buzz-postgres-data:
    driver: local
  buzz-redis-data:
    driver: local
  buzz-media-data:
    driver: local
  buzz-git-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

services:
  # ─────────────────────────────────────────────────────────────
  # 1. PostgreSQL 17 (Event Storage, FTS Search & Audit Log)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: buzz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - buzz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buzz} -d ${POSTGRES_DB:-buzz}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024m

  # ─────────────────────────────────────────────────────────────
  # 2. Redis 7 (Pub/Sub, Presence, Heartbeats & Typing)
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "${REDIS_PASSWORD}" ]; then
        redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - buzz-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - buzz-network
    healthcheck:
      test: >
        sh -c 'if [ -n "${REDIS_PASSWORD}" ]; then
          redis-cli -a "${REDIS_PASSWORD}" ping;
        else
          redis-cli ping;
        fi'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m

  # ─────────────────────────────────────────────────────────────
  # 3. Buzz Relay (Core Nostr Relay + Web Interface)
  # ─────────────────────────────────────────────────────────────
  relay:
    image: ghcr.io/block/buzz:latest
    container_name: buzz-relay
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      BUZZ_RELAY_URL: ${RELAY_PUBLIC_URL:-ws://localhost:8080}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:-}
      BUZZ_RELAY_OWNER_PUBKEY: ${BUZZ_RELAY_OWNER_PUBKEY:-}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET:-}
      BUZZ_REQUIRE_AUTH_TOKEN: ${BUZZ_REQUIRE_AUTH_TOKEN:-false}
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: ${BUZZ_REQUIRE_RELAY_MEMBERSHIP:-false}
      BUZZ_AUDIT_ENABLED: ${BUZZ_AUDIT_ENABLED:-true}
      BUZZ_HUDDLE_AUDIO_AVAILABLE: ${BUZZ_HUDDLE_AUDIO_AVAILABLE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - buzz-media-data:/var/lib/buzz/media
      - buzz-git-data:/var/lib/buzz/git
    ports:
      - "${APP_PORT:-4005}:8080"
    networks:
      - buzz-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/info || curl -f http://localhost:8080/_liveness || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────────────────────
  # 4. Swarm AI Agent Orchestrator (Bonifade Swarm Brain)
  # ─────────────────────────────────────────────────────────────
  agent-orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    image: bonifade/buzz-agent-orchestrator:latest
    container_name: buzz-agent-orchestrator
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    env_file:
      - .env
    volumes:
      - ./agents:/app/agents:ro
      - ./assets:/app/assets:ro
      - ./departments:/app/departments:ro
      - ./marketing:/app/marketing:ro
      - ./workflows:/app/workflows:ro
      - ./data:/app/data
      - ./SOUL.md:/app/SOUL.md:ro
    networks:
      - buzz-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8888/health\")' || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # 5. Telegram Messaging Bridge
  # ─────────────────────────────────────────────────────────────
  bridge-telegram:
    build:
      context: .
      dockerfile: docker/Dockerfile.telegram
    image: bonifade/buzz-bridge-telegram:latest
    container_name: buzz-bridge-telegram
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_started
    env_file:
      - .env
    networks:
      - buzz-network
    deploy:
      resources:
        limits:
          memory: 256m

  # ─────────────────────────────────────────────────────────────
  # 6. WhatsApp Cloud API & Webhook Bridge
  # ─────────────────────────────────────────────────────────────
  bridge-whatsapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.whatsapp
    image: bonifade/buzz-bridge-whatsapp:latest
    container_name: buzz-bridge-whatsapp
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_started
    env_file:
      - .env
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - buzz-network
    deploy:
      resources:
        limits:
          memory: 256m

  # ─────────────────────────────────────────────────────────────
  # 7. SMTP & Email Messaging Bridge
  # ─────────────────────────────────────────────────────────────
  bridge-smtp:
    build:
      context: .
      dockerfile: docker/Dockerfile.smtp
    image: bonifade/buzz-bridge-smtp:latest
    container_name: buzz-bridge-smtp
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_started
    env_file:
      - .env
    networks:
      - buzz-network
    deploy:
      resources:
        limits:
          memory: 256m

  # ─────────────────────────────────────────────────────────────
  # 8. Caddy Reverse Proxy & Automated SSL (Optional for VPS)
  # ─────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: buzz-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - buzz-network
    depends_on:
      - relay
    profiles:
      - caddy
