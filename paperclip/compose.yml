name: bonifade-paperclip
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U paperclip -d paperclip]
      interval: 5s
      timeout: 5s
      retries: 30
  server:
    image: ghcr.io/paperclipai/paperclip:sha-50b932a142216331b8d476042b454bc123739c40
    restart: unless-stopped
    pids_limit: 2048
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-https://company.bonifadetechnologies.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?Set signing secret}
    volumes:
      - paperclip-data:/paperclip
      - ..:/company:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  paperclip-data:
